<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>Zelda-OOT-Zero-Dollar-Remake</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000000;
		}
		#canvas {
			width: 100%;
			height: 100%;
			display: block;
		}
		#loading {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #000000;
			color: #ffffff;
			font-family: sans-serif;
			z-index: 10;
		}
		#loading img {
			width: 128px;
			height: 128px;
			margin-bottom: 20px;
		}
		#loading .bar {
			width: 300px;
			height: 10px;
			background: #333333;
			border-radius: 5px;
			overflow: hidden;
		}
		#loading .bar-fill {
			height: 100%;
			width: 0%;
			background: #ffffff;
			transition: width 0.2s;
		}
	</style>
</head>
<body>
	<div id="loading">
		<img src="/icon.png" alt="Loading">
		<div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
		<p id="status">Loading...</p>
	</div>
	<canvas id="canvas"></canvas>
	<script src="engine.js"></script>
	<script>
		const canvas = document.getElementById('canvas');
		const loading = document.getElementById('loading');
		const barFill = document.getElementById('bar-fill');
		const status = document.getElementById('status');

		const engine = new Engine(canvas);

		engine.startGame({
			executable: 'index',
			mainPack: 'index.pck',
		}).then(() => {
			loading.style.display = 'none';
		}).catch((err) => {
			status.textContent = 'Error: ' + err;
		});

		// Progress updates (Godot 4.7)
		if (engine.setProgressFunc) {
			engine.setProgressFunc((current, total) => {
				if (total > 0) {
					barFill.style.width = (current / total * 100) + '%';
				}
			});
		}
	</script>
</body>
</html>
