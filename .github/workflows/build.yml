name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  export:
    name: Export Game
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [Win64, Linux, Web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use_mono: false
          include_export_templates: true

      - name: Export
        run: |
          mkdir -p build
          godot --headless --export-release "${{ matrix.preset }}" "build/${{ matrix.preset }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: build/${{ matrix.preset }}.zip