name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  export:
    name: Export Game
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [Win64, Linux, Web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export with Godot
        uses: firebelley/godot-export@v5
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
          export_templates_download_url: https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=export_templates.tpz&platform=templates
          relative_project_path: ./
          export_preset: ${{ matrix.preset }}
          export_path: build/${{ matrix.preset }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: build/${{ matrix.preset }}.zip