name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  export:
    name: Export Game
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [Win64, Linux, Web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Godot
        uses: godot-actions/godot-build@v1
        with:
          godot_version: '4.7.2'
          export_templates: true
          export_preset: ${{ matrix.preset }}
          project_path: ./
          export_path: build/${{ matrix.preset }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: build/${{ matrix.preset }}.zip